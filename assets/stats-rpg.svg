<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Fiche personnage : niveau M2, statistiques et quête principale du stage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1225"/>
      <stop offset="1" stop-color="#2A173B"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" x2="1">
      <stop offset="0" stop-color="#F3A9CF"/>
      <stop offset="1" stop-color="#7B5CE0"/>
    </linearGradient>
    <linearGradient id="avbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2A60"/>
      <stop offset="1" stop-color="#6A3A86"/>
    </linearGradient>
    <linearGradient id="low" x1="0" x2="1">
      <stop offset="0" stop-color="#FF8FA3"/>
      <stop offset="1" stop-color="#F6C177"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .px { font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .lbl { font-size: 15px; fill: #DCD0F2; }
      .val { font-size: 14px; fill: #FFFFFF; font-weight: 700; }
      .hint { font-size: 12px; fill: #A398B5; font-style: italic; }
      .bob { animation: bob 2.6s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      .blink { animation: blinkEye 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes blinkEye { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } 96% { transform: scaleY(1); } }
      .tw { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.15); } }
      .heart { animation: floaty 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes floaty { 0%, 100% { transform: translateY(0) scale(1); opacity: .9; } 50% { transform: translateY(-8px) scale(1.12); opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="23" fill="none" stroke="#3A3049" stroke-width="2"/>

  <!-- Avatar chibi -->
  <g transform="translate(40 40)"><g class="bob">
    <rect width="150" height="162" rx="28" fill="url(#avbg)"/>
    <g fill="#FFFFFF">
      <path class="tw" d="M18 26 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
      <path class="tw" style="animation-delay:.9s" d="M132 112 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/>
      <path class="tw" style="animation-delay:1.6s" d="M128 22 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2z"/>
    </g>
    <path class="heart" d="M22 120 c-4 -5 -11 -1 -7 5 l7 7 7 -7 c4 -6 -3 -10 -7 -5z" fill="#F3A9CF"/>

    <!-- cheveux (arrière) -->
    <path d="M33 66 Q31 22 75 20 Q119 22 117 66 L120 104 Q128 130 116 162 L34 162 Q22 130 30 104 Z" fill="#2B1A14"/>
    <path d="M38 96 Q34 120 40 150" stroke="#4A3226" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M112 96 Q116 120 110 150" stroke="#4A3226" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>

    <!-- tenue : blazer + chemise -->
    <path d="M26 162 Q30 124 75 120 Q120 124 124 162 Z" fill="#3B2F5C"/>
    <path d="M62 121 L75 146 L88 121 Q75 126 62 121 Z" fill="#FFFFFF"/>
    <path d="M62 121 L70 133 L58 131 Z M88 121 L80 133 L92 131 Z" fill="#EDE6F7"/>
    <path d="M60 122 L75 156 L54 140 Z M90 122 L75 156 L96 140 Z" fill="#4A3B72"/>
    <circle cx="75" cy="139" r="2.4" fill="#F3A9CF"/>

    <!-- cou + visage -->
    <rect x="68" y="104" width="14" height="18" rx="6" fill="#E9B593"/>
    <ellipse cx="75" cy="76" rx="34" ry="35" fill="#F4CBAA"/>

    <!-- mèches devant -->
    <path d="M42 60 Q36 98 41 132 Q48 104 49 70 Z" fill="#2B1A14"/>
    <path d="M108 60 Q114 98 109 132 Q102 104 101 70 Z" fill="#2B1A14"/>
    <!-- frange rideau, raie au milieu -->
    <path d="M39 74 Q36 23 75 23 Q114 23 111 74 Q109 56 98 50 Q86 44 75 48 Q64 44 52 50 Q41 56 39 74 Z" fill="#2B1A14"/>
    <path d="M52 33 Q60 28 68 30" stroke="#5A3F30" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".8"/>

    <!-- yeux -->
    <g class="blink">
      <ellipse cx="62" cy="78" rx="5.2" ry="6.6" fill="#2A1B30"/>
      <ellipse cx="88" cy="78" rx="5.2" ry="6.6" fill="#2A1B30"/>
      <circle cx="60.3" cy="75.4" r="2" fill="#FFFFFF"/>
      <circle cx="86.3" cy="75.4" r="2" fill="#FFFFFF"/>
      <circle cx="63.6" cy="80.6" r="1" fill="#FFFFFF"/>
      <circle cx="89.6" cy="80.6" r="1" fill="#FFFFFF"/>
    </g>
    <path d="M56 71 Q62 68 68 71" stroke="#2A1B30" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M82 71 Q88 68 94 71" stroke="#2A1B30" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- lunettes rondes aux verres rosés -->
    <g stroke="#2A1B30" stroke-width="2.2">
      <circle cx="62" cy="78" r="11.5" fill="#F3A9CF" fill-opacity=".18"/>
      <circle cx="88" cy="78" r="11.5" fill="#F3A9CF" fill-opacity=".18"/>
      <path d="M73.5 77 Q75 75 76.5 77" fill="none"/>
    </g>
    <path d="M55 72 Q58 69 62 69" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>

    <!-- joues, nez, sourire -->
    <ellipse cx="51" cy="93" rx="6.5" ry="3.8" fill="#F38BB8" opacity=".55"/>
    <ellipse cx="99" cy="93" rx="6.5" ry="3.8" fill="#F38BB8" opacity=".55"/>
    <path d="M73.5 88 Q75 90 76.5 88" stroke="#D49A78" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M67 95 Q75 104 83 95 Q75 98.5 67 95 Z" fill="#E46A8E"/>
    <path d="M70 96.4 Q75 98.4 80 96.4" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- barrette fleur -->
    <g transform="translate(103 40)"><g fill="#F3A9CF" class="pulse">
      <circle cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/>
      <circle r="3" fill="#FFE3F1"/>
    </g></g>
  </g></g>
  <g class="t">
    <text x="115" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Meryem</text>
    <text x="115" y="245" text-anchor="middle" font-size="12" fill="#F3A9CF">classe : Dev full-stack</text>
    <rect x="62" y="256" width="106" height="22" rx="11" fill="#7B5CE0"/>
    <text x="115" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" class="px">NIV. M2 ✦</text>
  </g>

  <!-- Statistiques -->
  <g class="t" transform="translate(240 40)">
    <text x="0" y="0" font-size="13" fill="#A398B5" letter-spacing="2">STATISTIQUES</text>

    <g transform="translate(0 30)">
      <text class="lbl" y="0">💻 Code</text>
      <rect x="200" y="-12" width="290" height="14" rx="7" fill="#2B2438"/>
      <rect x="200" y="-12" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" to="267" dur="1.2s" begin=".2s" fill="freeze"/></rect>
      <text class="val" x="502" y="0">92</text>
    </g>
    <g transform="translate(0 62)">
      <text class="lbl" y="0">☕ Café</text>
      <rect x="200" y="-12" width="290" height="14" rx="7" fill="#2B2438"/>
      <rect x="200" y="-12" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" to="290" dur="1.2s" begin=".4s" fill="freeze"/></rect>
      <text class="val" x="502" y="0">MAX</text>
    </g>
    <g transform="translate(0 94)">
      <text class="lbl" y="0">🎨 Créativité</text>
      <rect x="200" y="-12" width="290" height="14" rx="7" fill="#2B2438"/>
      <rect x="200" y="-12" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" to="275" dur="1.2s" begin=".6s" fill="freeze"/></rect>
      <text class="val" x="502" y="0">95</text>
    </g>
    <g transform="translate(0 126)">
      <text class="lbl" y="0">🐛 Patience avec les bugs</text>
      <rect x="200" y="-12" width="290" height="14" rx="7" fill="#2B2438"/>
      <rect x="200" y="-12" width="0" height="14" rx="7" fill="url(#fill)"><animate attributeName="width" values="0;250;180" keyTimes="0;.6;1" dur="2s" begin=".8s" fill="freeze"/></rect>
      <text class="val" x="502" y="0">62</text>
    </g>
    <g transform="translate(0 158)">
      <text class="lbl" y="0">😴 Sommeil</text>
      <rect x="200" y="-12" width="290" height="14" rx="7" fill="#2B2438"/>
      <rect x="200" y="-12" width="0" height="14" rx="7" fill="url(#low)"><animate attributeName="width" to="58" dur="1.2s" begin="1s" fill="freeze"/></rect>
      <text class="val" x="502" y="0">20</text>
      <text class="hint" x="540" y="0">(période d'examens)</text>
    </g>
  </g>

  <!-- Quête -->
  <g class="t" transform="translate(240 228)">
    <rect width="620" height="50" rx="16" fill="#FFFFFF" fill-opacity=".05" stroke="#F3A9CF" stroke-opacity=".45" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="21" font-size="12" fill="#F3A9CF" letter-spacing="2" font-weight="700">⚔ QUÊTE PRINCIPALE</text>
    <text x="20" y="40" font-size="15" fill="#FFFFFF">Trouver un stage de 6 mois · février 2027 · récompense : +1 dev motivée</text>
    <circle class="pulse" cx="596" cy="25" r="7" fill="#8FE3C8"/>
  </g>
</svg>
