<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" aria-label="Mia OS terminal: whoami, git status, internship and sudo make coffee">
  <defs>
    <style>
      .m { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14.5px; }
      .p { fill: #8FE3C8; } .w { fill: #F4EEFB; } .d { fill: #B9AECB; } .y { fill: #F6C177; } .r { fill: #F3A9CF; }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <!-- one reveal zone per typed command -->
    <clipPath id="c1"><rect x="176" y="68" height="24" width="0"><animate attributeName="width" from="0" to="70" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="176" y="164" height="24" width="0"><animate attributeName="width" from="0" to="100" begin="2.1s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="176" y="260" height="24" width="0"><animate attributeName="width" from="0" to="100" begin="4.0s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="176" y="332" height="24" width="0"><animate attributeName="width" from="0" to="160" begin="5.8s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect width="900" height="452" rx="16" fill="#0E0B12"/>
  <rect x=".5" y=".5" width="899" height="451" rx="16" fill="none" stroke="#3A3049"/>
  <path d="M16 0h868a16 16 0 0 1 16 16v24H0V16A16 16 0 0 1 16 0z" fill="#2B2438"/>
  <circle cx="24" cy="20" r="6" fill="#FF8FA3"/>
  <circle cx="44" cy="20" r="6" fill="#F6C177"/>
  <circle cx="64" cy="20" r="6" fill="#8FE3C8"/>
  <text x="88" y="25" class="m d" font-size="13">mia@mulhouse: ~/portfolio</text>
  <text x="876" y="25" text-anchor="end" class="m d" font-size="13">✿ Mia OS</text>

  <g class="m">
    <!-- 1. whoami -->
    <text x="28" y="84"><tspan class="p">mia@mulhouse ~ $</tspan></text>
    <text x="176" y="84" class="w" clip-path="url(#c1)">whoami</text>
    <g opacity="0"><set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/>
      <text x="28" y="112" class="d">mia (meryem belmouaddine). full-stack &amp; mobile developer.</text>
      <text x="28" y="136" class="d">born in casablanca, compiling in mulhouse.</text>
    </g>

    <!-- 2. git status -->
    <text x="28" y="180" opacity="0"><tspan class="p">mia@mulhouse ~ $</tspan><set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/></text>
    <text x="176" y="180" class="w" clip-path="url(#c2)">git status</text>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.0s" fill="freeze"/>
      <text x="28" y="208" class="d">On branch main. Ahead of 'origin/expectations' by 8 projects.</text>
      <text x="28" y="232" class="d">modified:   <tspan class="y">career (internship, feb 2027)</tspan></text>
    </g>

    <!-- 3. internship -->
    <text x="28" y="276" opacity="0"><tspan class="p">mia@mulhouse ~ $</tspan><set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/></text>
    <text x="176" y="276" class="w" clip-path="url(#c3)">internship</text>
    <text x="28" y="304" class="y" opacity="0">6 months · from feb 2027 · on site · alsace first, anywhere in france works<set attributeName="opacity" to="1" begin="4.9s" fill="freeze"/></text>

    <!-- 4. coffee -->
    <text x="28" y="348" opacity="0"><tspan class="p">mia@mulhouse ~ $</tspan><set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/></text>
    <text x="176" y="348" class="w" clip-path="url(#c4)">sudo make coffee</text>
    <text x="28" y="376" class="r" opacity="0">mia is not in the sudoers file. This incident will be reported to her mum.<set attributeName="opacity" to="1" begin="7.1s" fill="freeze"/></text>

    <!-- cursor -->
    <g opacity="0"><set attributeName="opacity" to="1" begin="7.7s" fill="freeze"/>
      <text x="28" y="420"><tspan class="p">mia@mulhouse ~ $</tspan></text>
      <rect class="cur" x="178" y="407" width="9" height="17" fill="#F3A9CF"/>
    </g>
  </g>
</svg>
