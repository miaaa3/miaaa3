# Génère le serpent qui mange la grille de contributions, chaque jour.
name: Serpent des contributions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Générer les SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#B65FB0&color_dots=#EEE8F8,#DCD0F2,#C9B8F0,#9E82E8,#7B5CE0
            dist/snake-dark.svg?palette=github-dark&color_snake=#F3A9CF&color_dots=#221C2D,#3B2F5C,#5A3FB4,#7B5CE0,#B65FB0

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
